<!--
  목록 카드 템플릿
  사용: cases/index.html 의 <div class="cases-grid"> 안에 붙여넣기

  교체 항목:
  - data-case-id="CASE_ID"
  - #CASE_NUMBER (라벨)
  - CASE_TITLE, CASE_SUMMARY
  - CASE_TYPE, CASE_CARRIER, CASE_DATE (datetime 포함)
  - href="CASE_ID/" (자세히 보기 링크)

  추가 후:
  1. js/cases-data.js CASES 배열에 동일 사례 추가
  2. cases/CASE_ID/index.html 생성 (detail.index.html 복사)
  3. cases/index.html JSON-LD ItemList 에 ListItem 추가
  4. sitemap.xml 에 /cases/CASE_ID/ 추가
  5. data-cases-badge="count" 숫자 갱신 (또는 cases-data.js 자동 반영)
-->
<article class="case-card" data-case-id="CASE_ID">
  <p class="case-card__label">실제 상담 사례 #CASE_NUMBER</p>
  <p class="case-card__stars" aria-label="별점 5점 만점에 CASE_RATING점">★★★★★</p>
  <h2 class="case-card__title">CASE_TITLE</h2>
  <p class="case-card__summary">CASE_SUMMARY</p>
  <dl class="case-card__meta">
    <div>
      <dt>상담유형</dt>
      <dd>CASE_TYPE</dd>
    </div>
    <div>
      <dt>통신사</dt>
      <dd>CASE_CARRIER</dd>
    </div>
    <div>
      <dt>작성일</dt>
      <dd><time datetime="CASE_DATE">CASE_DATE</time></dd>
    </div>
  </dl>
  <div class="case-card__action">
    <a class="btn btn--primary btn--block" href="CASE_ID/">자세히 보기</a>
  </div>
</article>
